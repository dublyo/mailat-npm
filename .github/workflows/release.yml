name: Release

on:
  push:
    tags:
      - "v*"
      - "go/v*"

permissions:
  contents: read

jobs:
  verify:
    # Builds and tests the tagged commit WITHOUT any publishing credential or
    # OIDC token, so dependency install scripts never run next to them.
    name: Verify release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:examples
      - run: npm test

  npm:
    name: Publish to npm
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Create the "npm" environment in the repository settings with required
    # reviewers and a v* tag rule, and store NPM_TOKEN there (not as a repo
    # secret). With npm trusted publishing (OIDC) configured for this repo and
    # workflow, NPM_TOKEN can be removed entirely.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # No dependency install scripts run in the job that holds the token.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  go:
    # Go modules need no upload: the go/vX.Y.Z tag is what `go get` and the
    # module proxy resolve. This job only proves the tagged code is green.
    name: Test Go module
    if: startsWith(github.ref, 'refs/tags/go/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: vet and test
        working-directory: go
        run: go vet ./... && go test -race -count=1 ./...
